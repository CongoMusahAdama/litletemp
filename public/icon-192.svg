<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="100%" style="stop-color:#FFF8E7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  
  <!-- Subtle pattern overlay -->
  <g opacity="0.08">
    <circle cx="120" cy="120" r="60" fill="#1a1a1a"/>
    <circle cx="392" cy="392" r="80" fill="#1a1a1a"/>
    <circle cx="420" cy="100" r="40" fill="#1a1a1a"/>
    <circle cx="100" cy="420" r="50" fill="#1a1a1a"/>
  </g>
  
  <!-- Two interlocking hearts -->
  <g transform="translate(256, 270) scale(1.6)">
    <!-- Left heart (Me) -->
    <path d="M -48 0 C -48 -20, -16 -32, 0 -32 C 18 -32, 32 -14, 32 8 C 32 30, 10 48, -8 60 C -26 48, -48 30, -48 0 Z" 
          fill="url(#heartGrad)" stroke="#F59E0B" stroke-width="2" transform="rotate(-15) translate(-12, -4)"/>
    
    <!-- Right heart (Babe) -->
    <path d="M 48 0 C 48 -20, 16 -32, 0 -32 C -18 -32, -32 -14, -32 8 C -32 30, -10 48, 8 60 C 26 48, 48 30, 48 0 Z" 
          fill="url(#heartGrad)" stroke="#F59E0B" stroke-width="2" transform="rotate(15) translate(12, -4)"/>
    
    <!-- Small sparkle between hearts -->
    <g transform="translate(0, -10)">
      <polygon points="0,-6 1,-2 5,-2 2,1 3,5 0,3 -3,5 -2,1 -5,-2 -1,-2" fill="#FBBF24"/>
      <polygon points="0,-4 0.5,-1.5 2.5,-1.5 1,0.5 1.5,2.5 0,1.5 -1.5,2.5 -1,0.5 -2.5,-1.5 -0.5,-1.5" fill="#fff"/>
    </g>
  </g>
  
  <!-- "LT" initials at bottom -->
  <text x="256" y="420" font-family="system-ui, sans-serif" font-size="64" font-weight="800" fill="#1a1a1a" text-anchor="middle" opacity="0.15">LT</text>
</svg>